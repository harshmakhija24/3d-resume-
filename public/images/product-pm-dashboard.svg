  <g font-family="Arial">
    <rect x="64" y="150" width="250" height="128" rx="16" fill="#26382b"/><text x="86" y="183" fill="#aabd9e" font-size="13">ACTIVE PROJECTS</text><text x="86" y="235" fill="#f4f3ec" font-size="42" font-weight="700">04</text><text x="176" y="233" fill="#c8ef75" font-size="13">+2 on track</text>
    <rect x="332" y="150" width="250" height="128" rx="16" fill="#26382b"/><text x="354" y="183" fill="#aabd9e" font-size="13">MILESTONES</text><text x="354" y="235" fill="#f4f3ec" font-size="42" font-weight="700">06</text><text x="444" y="233" fill="#f0a6bd" font-size="13">01 at risk</text>
    <rect x="600" y="150" width="250" height="128" rx="16" fill="#26382b"/><text x="622" y="183" fill="#aabd9e" font-size="13">VELOCITY</text><text x="622" y="235" fill="#f4f3ec" font-size="42" font-weight="700">87%</text><text x="748" y="233" fill="#c8ef75" font-size="13">steady</text>
    <rect x="868" y="150" width="250" height="128" rx="16" fill="#26382b"/><text x="890" y="183" fill="#aabd9e" font-size="13">OVERDUE TASKS</text><text x="890" y="235" fill="#f4f3ec" font-size="42" font-weight="700">03</text><text x="980" y="233" fill="#f0a6bd" font-size="13">needs review</text>
