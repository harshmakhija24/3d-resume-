<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PM Dashboard preview</title>
  <desc id="desc">A dark product dashboard preview with project metrics and a work table.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101812"/><stop offset="1" stop-color="#243329"/></linearGradient>
    <linearGradient id="lime" x1="0" x2="1"><stop stop-color="#c8ef75"/><stop offset="1" stop-color="#8dbb54"/></linearGradient>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="692" rx="24" fill="#18231c" stroke="#536550" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="84" rx="24" fill="#213025"/>
  <circle cx="78" cy="76" r="18" fill="url(#lime)"/><text x="69" y="83" fill="#122014" font-family="Arial" font-size="18" font-weight="700">P</text>
